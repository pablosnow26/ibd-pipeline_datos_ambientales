version: "3.8"

services:

  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=false
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - WEBHOOK_URL=http://localhost:5678/
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - datalake

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minio
      - MINIO_ROOT_PASSWORD=minio123
    volumes:
      - minio_data:/data
    networks:
      - datalake

  mc-init:
    image: minio/mc:RELEASE.2023-03-20T17-17-53Z
    container_name: mc-init
    depends_on:
      - minio
    restart: "no"   # Sólo queremos que se ejecute una vez y se apague
    entrypoint: >
      /bin/sh -c "
      echo 'Esperando a que MinIO inicie...';
      sleep 5;
      /usr/bin/mc alias set myminio http://minio:9000 minio minio123;
      /usr/bin/mc mb myminio/raw-data || true;
      /usr/bin/mc mb myminio/cleaned-data || true;
      /usr/bin/mc mb myminio/processed-data || true;
      echo '¡Buckets creados con éxito!';
      exit 0;
      "
    networks:
      - datalake

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"   
      - "15672:15672" 
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq  
    networks:
      - datalake
  
  jupyter:
    image: jupyter/minimal-notebook
    container_name: jupyter
    ports:
      - "8888:8888"
    command: ["start-notebook.sh",
              "--NotebookApp.token=''",
              "--NotebookApp.password=''"]
    networks:
      - datalake
    environment:
      - JUPYTER_ENABLE_LAB=yes

  superset:
    build: .
    ports:
      - "8088:8088"
    environment:
      SUPERSET_SECRET_KEY: 'your_secret_key_here'
    volumes:
      - ./superset_config.py:/app/superset/superset_config.py
    depends_on:
      - postgres
    command: >
      bash -c "pip install psycopg2-binary &&
      superset db upgrade &&
      superset fab create-admin --username admin --firstname Admin --lastname User --email admin@superset.com --password admin &&
      superset init &&
      superset run -p 8088 --host=0.0.0.0"
    networks:
      - datalake
  
  postgres:
    image: postgres:14
    container_name: retail_dw
    environment:
      POSTGRES_USER: dwuser
      POSTGRES_PASSWORD: dwpassword
      POSTGRES_DB: retail_dw
    ports:
      - "5432:5432"
    volumes:
      - ./datos_csv:/datos_csv
      - ./init:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data
    networks:
      - datalake


volumes:
  n8n_data:
  minio_data:
  rabbitmq_data:
  postgres_data:

networks:
  datalake:
    driver: bridge